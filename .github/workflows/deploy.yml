name: Deploy SnapTiles API
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the target SnapTiles deployment token
        required: true
        type: environment
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package SQLite API
        run: |
          mkdir deploy-api
          cp api/package.json api/package-lock.json deploy-api/
          cp -R api/dist deploy-api/dist
          npm ci --prefix deploy-api --omit=dev --workspaces=false
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SNAP_TILES_API_APP_NAME }}
          publish-profile: ${{ secrets.SNAP_TILES_API_PUBLISH_PROFILE }}
          package: deploy-api
