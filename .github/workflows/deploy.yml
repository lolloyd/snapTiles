name: Deploy SnapTiles
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the target SnapTiles deployment token
        required: true
        type: environment
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package compiled API
        run: |
          mkdir deploy-api
          cp api/package.json api/host.json deploy-api/
          cp -R api/dist deploy-api/dist
          npm install --prefix deploy-api --omit=dev --ignore-scripts --workspaces=false
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          output_location: ""
          api_location: deploy-api
          skip_app_build: true
          skip_api_build: true
